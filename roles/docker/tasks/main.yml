
---
# Install and configure Docker on Debian homelab servers.

- name: Install Docker and Compose
  # Install Debian's Docker Engine package and Compose tooling.
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start Docker
  # Start Docker now and automatically after future reboots.
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

